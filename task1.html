<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a train ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0F6B5F;
      --orange: #F2A93B;
      --dark: #16302B;
      --bg: #F4F7F5;
      --light-green: #F6FFEC;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #e8eeeb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .ticket-card {
      background: var(--bg);
      border-radius: 1.25rem;
      box-shadow: 0 8px 30px rgba(22, 48, 43, 0.12);
      max-width: 720px;
      width: 100%;
      overflow: hidden;
    }
    .ticket-header {
      background: var(--teal);
      color: #fff;
      padding: 1rem 1.5rem;
      font-weight: 600;
      font-size: 1.15rem;
      border-radius: 1.25rem 1.25rem 0 0;
    }
    .ticket-body {
      padding: 1.5rem;
    }
    .trip-type {
      display: inline-flex;
      background: #fff;
      border-radius: 2rem;
      padding: 0.25rem;
      border: 1px solid #d0ddd8;
      margin-bottom: 1.25rem;
    }
    .trip-type input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .trip-type label {
      padding: 0.4rem 1.1rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--dark);
      margin: 0;
      transition: all 0.2s;
    }
    .trip-type input:checked + label {
      background: var(--teal);
      color: #fff;
    }
    .trip-type input:focus-visible + label {
      outline: 2px solid var(--orange);
      outline-offset: 2px;
    }
    .form-floating > .form-control,
    .form-floating > .form-select {
      border-radius: 0.75rem;
      border: 1px solid #c5d5cf;
      background: #fff;
    }
    .form-floating > .form-control:focus,
    .form-floating > .form-select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 0.2rem rgba(15, 107, 95, 0.2);
    }
    .form-floating > label {
      color: #6b7c77;
    }
    .carriage-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .carriage-group .form-check {
      margin: 0;
    }
    .carriage-group .form-check-input {
      border-color: var(--teal);
    }
    .carriage-group .form-check-input:checked {
      background-color: var(--teal);
      border-color: var(--teal);
    }
    .carriage-group .form-check-input:focus {
      box-shadow: 0 0 0 0.2rem rgba(15, 107, 95, 0.25);
    }
    .phone-group .input-group-text {
      background: var(--light-green);
      border: 1px solid #c5d5cf;
      border-radius: 0.75rem 0 0 0.75rem;
      color: var(--dark);
      font-weight: 500;
    }
    .phone-group .form-control {
      border-radius: 0 0.75rem 0.75rem 0;
      border: 1px solid #c5d5cf;
    }
    .phone-group .form-control:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 0.2rem rgba(15, 107, 95, 0.2);
    }
    .form-check-input {
      border-color: #8aa89e;
    }
    .form-check-input:checked {
      background-color: var(--teal);
      border-color: var(--teal);
    }
    .form-check-input:focus {
      box-shadow: 0 0 0 0.2rem rgba(15, 107, 95, 0.25);
    }
    .btn-clear {
      background: #fff;
      border: 1.5px solid var(--teal);
      color: var(--teal);
      border-radius: 2rem;
      padding: 0.5rem 1.5rem;
      font-weight: 600;
    }
    .btn-clear:hover {
      background: var(--light-green);
      border-color: var(--teal);
      color: var(--teal);
    }
    .btn-find {
      background: var(--orange);
      border: none;
      color: #fff;
      border-radius: 2rem;
      padding: 0.5rem 1.5rem;
      font-weight: 600;
    }
    .btn-find:hover {
      background: #e09a2e;
      color: #fff;
    }
    .btn-find:focus-visible,
    .btn-clear:focus-visible {
      outline: 2px solid var(--dark);
      outline-offset: 2px;
    }
    .btn-row {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    @media (max-width: 575.98px) {
      .btn-row {
        flex-direction: column-reverse;
        width: 100%;
      }
      .btn-row .btn {
        width: 100%;
      }
      .ticket-body {
        padding: 1rem;
      }
    }
    .section-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="ticket-card">
    <div class="ticket-header">Book a train ticket</div>
    <div class="ticket-body">
      <form action="#" method="get">
        <div class="trip-type" role="group" aria-label="Trip type">
          <input type="radio" name="trip" id="oneway" value="oneway" checked>
          <label for="oneway">One way</label>
          <input type="radio" name="trip" id="roundtrip" value="roundtrip">
          <label for="roundtrip">Round trip</label>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="from" name="from" placeholder="From" value="Astana" required>
              <label for="from">From</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="to" name="to" placeholder="To" value="Almaty" required>
              <label for="to">To</label>
            </div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <div class="form-floating">
              <input type="date" class="form-control" id="departure" name="departure" required>
              <label for="departure">Departure</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-floating">
              <input type="date" class="form-control" id="return" name="return">
              <label for="return">Return</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-floating">
              <select class="form-select" id="passengers" name="passengers" required>
                <option value="1" selected>1 adult</option>
                <option value="2">2 adults</option>
                <option value="3">3 adults</option>
                <option value="4">4 adults</option>
                <option value="5">5 adults</option>
                <option value="6">6 adults</option>
              </select>
              <label for="passengers">Passengers</label>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <div class="section-label" id="carriage-label">Carriage class</div>
          <div class="carriage-group" role="radiogroup" aria-labelledby="carriage-label">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
              <label class="form-check-label" for="seat">Seat</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked>
              <label class="form-check-label" for="coupe">Coupe</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper">
              <label class="form-check-label" for="sleeper">Sleeper</label>
            </div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="phone" class="form-label section-label">Phone</label>
            <div class="input-group phone-group">
              <span class="input-group-text">+7</span>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" required>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
              <label for="email">Email</label>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="sms" name="sms">
            <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
            <label class="form-check-label" for="agree">I agree with the carriage rules</label>
          </div>
        </div>

        <div class="btn-row">
          <button type="reset" class="btn btn-clear">Clear</button>
          <button type="submit" class="btn btn-find">Find trains</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
